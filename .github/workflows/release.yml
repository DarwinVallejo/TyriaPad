# When a vX.Y.Z tag is pushed: builds, runs the tests, publishes and creates the GitHub release with the
# .zip and its SHA-256. The notes come from docs/releases/vX.Y.Z.md (it must exist).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests and publish
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.zip', '.sha256' } | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME $files --title "TyriaPad $env:GITHUB_REF_NAME" --notes-file "docs/releases/$env:GITHUB_REF_NAME.md"
